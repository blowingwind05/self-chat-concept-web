<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>项目设想短片 · 一个只和自己聊天的 App</title>
  <link rel="stylesheet" href="film.css?v=20">
  <link rel="stylesheet" href="embed.css?v=20">
  <script src="audio.js?v=31" defer></script>
  <script src="film.js?v=32" defer></script>
  <script src="player.js?v=28" defer></script>
</head>
<body class="is-embedded">
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="play-icon" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></symbol>
    <symbol id="pause-icon" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="replay-icon" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></symbol>
    <symbol id="sound-icon" viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5ZM16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
    <symbol id="mute-icon" viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5ZM16 9l6 6m0-6-6 6"/></symbol>
    <symbol id="full-icon" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol>
  </defs></svg>
<div class="player" id="player" data-state="poster">
        <div class="film-screen" id="film-screen">
          <canvas id="film-canvas" width="1600" height="900" role="img" aria-label="项目设想动画：一个只和自己聊天的 App"></canvas>
          <div class="start-gate" id="start-gate">
            <button class="start-button" id="start-sound" type="button"><svg><use href="#play-icon"/></svg><span>播放短片<small>立体声</small></span></button>
            <button class="silent-start" id="start-silent" type="button">静音观看</button>
          </div>
          <div class="end-gate" id="end-gate" hidden><button class="start-button" id="end-replay" type="button"><svg><use href="#replay-icon"/></svg> 再看一遍</button></div>
          <div class="screen-notice" id="screen-notice" role="status" hidden></div>
          <span class="film-signature" aria-hidden="true">项目设想 · 相关功能尚待开发</span>
        </div>
        <div class="transport" id="transport" aria-label="视频播放控制">
          <button class="icon-button" id="play-pause" type="button" aria-label="播放短片"><svg><use id="play-use" href="#play-icon"/></svg></button>
          <button class="icon-button replay-button" id="restart" type="button" aria-label="从头播放"><svg><use href="#replay-icon"/></svg></button>
          <span class="timecode" id="timecode">00:00 <span>/ 01:48</span></span>
          <div class="scrubber"><label class="sr-only" for="seek">播放进度</label><input id="seek" type="range" min="0" max="108" step="0.1" value="0" aria-valuetext="0 分 0 秒，共 1 分 48 秒"></div>
          <span class="scene-label" id="scene-label">开篇</span>
          <button class="icon-button" id="sound-toggle" type="button" aria-label="静音" aria-pressed="true"><svg><use id="sound-use" href="#sound-icon"/></svg></button>
          <button class="icon-button" id="fullscreen" type="button" aria-label="全屏观看"><svg><use href="#full-icon"/></svg></button>
        </div>
      </div>
  <p class="sr-only" id="scene-description" aria-live="polite">一个只和自己聊天的 App，项目设想短片，相关功能尚待开发。</p>
  <noscript><p class="noscript">启用 JavaScript 后可以播放短片。完整设想可在外层网页中阅读。</p></noscript>
</body>
</html>
